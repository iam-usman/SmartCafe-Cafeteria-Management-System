{% extends "base.html" %}
{% block title %}Add Customer{% endblock %}

{% block content %}
<div class="page-header">
    <h1>👥 Add Customer</h1>
    <a href="{{ url_for('customers') }}" class="btn btn-secondary">← Back</a>
</div>
<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Ahmed Ali" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" class="form-control" placeholder="e.g. 03001234567">
        </div>
        <button type="submit" class="btn btn-primary">✅ Add Customer</button>
    </form>
</div>
{% endblock %}
