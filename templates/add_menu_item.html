{% extends "base.html" %}
{% block title %}Add Menu Item{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Add Menu Item</h1>
    <a href="{{ url_for('menu') }}" class="btn btn-secondary">← Back</a>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>Item Name</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Chicken Biryani" required>
        </div>
        <div class="form-group">
            <label>Price (Rs.)</label>
            <input type="number" name="price" step="0.01" class="form-control" placeholder="e.g. 250" required>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category" class="form-control">
                <option value="Main Course">Main Course</option>
                <option value="Fast Food">Fast Food</option>
                <option value="Beverages">Beverages</option>
                <option value="Snacks">Snacks</option>
                <option value="Desserts">Desserts</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">✅ Add Item</button>
    </form>
</div>
{% endblock %}
