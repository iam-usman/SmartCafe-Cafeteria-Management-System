{% extends "base.html" %}
{% block title %}Edit Menu Item{% endblock %}

{% block content %}
<div class="page-header">
    <h1>✏️ Edit Menu Item</h1>
    <a href="{{ url_for('menu') }}" class="btn btn-secondary">← Back</a>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label>Item Name</label>
            <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
        </div>
        <div class="form-group">
            <label>Price (Rs.)</label>
            <input type="number" name="price" step="0.01" class="form-control" value="{{ item.price }}" required>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category" class="form-control">
                {% for cat in ['Main Course', 'Fast Food', 'Beverages', 'Snacks', 'Desserts'] %}
                <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
    </form>
</div>
{% endblock %}
