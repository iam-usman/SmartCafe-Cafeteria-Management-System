{% extends "base.html" %}
{% block title %}Staff{% endblock %}

{% block content %}
<div class="page-header">
    <h1>👤 Staff Management</h1>
    <a href="{{ url_for('add_staff') }}" class="btn btn-primary">➕ Add Staff</a>
</div>

<table class="table">
    <thead>
        <tr><th>ID</th><th>Name</th><th>Role</th></tr>
    </thead>
    <tbody>
        {% for s in staff %}
        <tr>
            <td>{{ s.staff_id }}</td>
            <td>{{ s.name }}</td>
            <td><span class="badge badge-blue">{{ s.role }}</span></td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="empty-msg">No staff found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
